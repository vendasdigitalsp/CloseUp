<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pix</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --text: #121212;
      --muted: #5f6368;
      --line: rgba(0, 0, 0, 0.16);
      --orange: #f57c00;
      --orange-dark: #ea6c00;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: var(--white);
      border-radius: 12px;
      padding: 36px 30px 30px;
      box-shadow: 0 0 0 rgba(0,0,0,0); 
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(3rem, 6vw, 6.2rem);
      line-height: 0.9;
      color: var(--orange);
      letter-spacing: -0.08em;
      padding: 4px 4px 0;
      position: relative;
    }

    .logo::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -18px;
      transform: translateX(-50%);
      width: 110%;
      height: 42px;
      background: repeating-radial-gradient(circle at center, transparent 0 7px, rgba(245,124,0,0.28) 7px 9px, transparent 9px 16px);
      opacity: 0.8;
      border-radius: 999px;
      filter: blur(0.2px);
    }

    .logo::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -8px;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      background: linear-gradient(180deg, rgba(245,124,0,0.2), rgba(245,124,0,0));
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      opacity: 0.8;
    }

    .title {
      margin: 18px 0 10px;
      text-align: center;
      font-size: clamp(2.4rem, 4vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #191919;
    }

    .amount {
      text-align: center;
      font-size: clamp(2rem, 4vw, 4.1rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.06em;
      margin: 8px 0 24px;
      color: #111111;
    }

    .divider {
      border-top: 2px dashed rgba(0, 0, 0, 0.14);
      margin: 18px 0 26px;
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin: 18px 0 30px;
    }

    .qr-box {
      width: min(86vw, 470px);
      aspect-ratio: 1;
      background: #fff;
      border: 4px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
    }

    .divider-bottom {
      border-top: 2px dashed rgba(0, 0, 0, 0.14);
      margin: 10px 0 24px;
    }

    .section-title {
      font-size: clamp(1.9rem, 3vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0 0 18px;
      color: #1a1a1a;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 560px) {
      .card {
        padding: 26px 18px 18px;
      }

      .logo {
        font-size: 3.4rem;
      }

      .title {
        font-size: 2.3rem;
      }

      .amount {
        font-size: 2.3rem;
      }

      .section-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="logo-wrap">
        <div class="logo">Inter</div>
      </div>

      <div class="title">Pix</div>
      <div class="amount">R$ 15,99</div>

      <div class="divider"></div>

      <div class="qr-wrap">
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=ff903682-54b3-4c75-a966-9382527d331f" alt="QR Code Pix" />
        </div>
      </div>

      <div class="divider-bottom"></div>

      <div class="section-title hidden">Sobre o QR Code</div>
    </div>
  </div>
</body>
</html>
